[project]
name = "jobpilot-ai"
version = "1.0.0"
description = "Agente pessoal de candidaturas a vagas de emprego (API backend)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "email-validator>=2.1,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "redis>=5.0,<9.0",
    "pyjwt>=2.8,<3.0",
    "argon2-cffi>=23.1,<27.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.2,<8.0",
    "httpx>=0.27,<1.0",
    "apscheduler>=3.10,<4.0",
    "cryptography>=42.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<10.0",
    "ruff>=0.5,<1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI usa chamadas em valores padrão (Depends, File) por design.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/versions/**" = ["E501"]  # migrations geradas pelo autogenerate
