name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# Cancela execuções antigas do mesmo branch quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: jobpilot
          POSTGRES_DB: jobpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Banco descartável do próprio job; nenhum segredo real é usado nos testes.
      TEST_DATABASE_URL: postgresql+psycopg://jobpilot:jobpilot@localhost:5432/jobpilot_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # versão mínima suportada (requires-python)
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Testes
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build --tag jobpilot-ai:ci .
